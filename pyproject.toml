[project]
name = "autopay-voice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.40.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.64.0",
    "vapi-server-sdk>=1.11.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
autopay = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
