<table class='w-full text-left text-sm'><thead class='sticky top-0 bg-white'><tr class='text-neutral-500'><th class='pb-1.5 pr-2 font-semibold normal-case text-[12px]' title='Internal call id'>Call</th><th class='pb-1.5 pr-2 font-semibold normal-case text-[12px]' title='Customer ID'>Customer</th><th class='pb-1.5 pr-2 font-semibold normal-case text-[12px]' title='Short: likely, under 90s · Standard: needs explanation · Extended: needs patience, human early'>Tier</th><th class='pb-1.5 pr-2 font-semibold normal-case text-[12px]' title='Identity verified on this call'>Verified</th><th class='pb-1.5 pr-2 font-semibold normal-case text-[12px]' title='Terminal outcome — click a row for transcript and audit'>Outcome</th><th class='pb-1.5'></th></tr></thead><tbody>{% for r in rows %}<tr class='border-t border-neutral-100 transition-colors hover:bg-[#faf8fd] cursor-pointer' hx-get='/partials/calls/{{ r.call_id }}' hx-target='#modal-body' hx-swap='innerHTML' onclick='openModal()'><td class='py-2 pr-2 font-mono text-[12px] font-medium'>#{{ r.call_id }}</td><td class='py-2 pr-2 font-mono text-xs'>{{ r.customer_id }}</td><td class='py-2 pr-2'><span class='rounded-full px-2 py-0.5 text-[11px] font-semibold {{ r.tier_pill }}' title='{{ r.tier_tip }}'>{{ r.tier_label }}</span></td><td class='py-2 pr-2 text-xs'><span class='inline-flex items-center gap-1.5'><span class='h-1.5 w-1.5 rounded-full {{ 'bg-green-500' if r.verified else 'bg-neutral-300' }}'></span>{{ 'yes' if r.verified else 'no' }}</span></td><td class='py-2 pr-2'><span class='rounded-full px-2 py-0.5 text-[11px] font-semibold {{ r.outcome_pill }}'>{{ r.outcome_label }}</span></td><td class='py-2 text-right whitespace-nowrap' onclick='event.stopPropagation()'><span class='inline-flex items-center gap-1'><button hx-get='/partials/calls/{{ r.call_id }}' hx-target='#modal-body' hx-swap='innerHTML' onclick='openModal()' class='rounded-full border border-neutral-200 bg-white px-3 py-1 text-xs font-medium text-neutral-600 hover:border-neutral-300 hover:text-neutral-900 transition-colors inline-flex items-center gap-1' title='Inspect call'>Inspect</button> <button hx-post='/partials/calls/cut' hx-vals='{{ r.vals_json|safe }}' hx-target='#console-msg' hx-swap='innerHTML' class='rounded-full border border-red-200 bg-white px-3 py-1 text-xs font-medium text-red-600 hover:bg-red-50 transition-colors inline-flex items-center gap-1' title='Stop this call'><i class="hgi hgi-stroke hgi-rounded hgi-call-disabled-02 text-lg"></i>Stop</button> <button hx-post='/partials/calls/join' hx-vals='{{ r.vals_json|safe }}' hx-target='#console-msg' hx-swap='innerHTML' class='rounded-full border border-neutral-200 bg-white px-3 py-1 text-xs font-medium text-neutral-600 hover:border-neutral-300 hover:text-neutral-900 transition-colors inline-flex items-center gap-1' title='Join and open a handoff'><i class="hgi hgi-stroke hgi-rounded hgi-customer-support text-lg"></i>Join</button></span></td></tr>{% else %}<tr><td class='py-8 text-center text-sm text-neutral-400'><span class='mx-auto mb-1 block h-8 w-8 rounded-full bg-neutral-100'></span>No calls yet — start one from the queue</td></tr>{% endfor %}</tbody></table>
