<table class='w-full text-left text-sm'><thead class='sticky top-0 bg-white'><tr class='text-neutral-500'><th class='pb-1.5 pl-1 pr-1 w-6'><input type='checkbox' id='q-all' class='h-3.5 w-3.5 accent-primary-foreground' title='Select all' /></th><th class='pb-1.5 pr-2 font-semibold normal-case text-[12px]' title='Customer ID'>ID</th><th class='pb-1.5 pr-2 font-semibold normal-case text-[12px]' title='Customer name'>Name</th><th class='pb-1.5 pr-2 font-semibold normal-case text-[12px]' title='Estimated probability this customer pays on contact — hover a row for reasons'>Pay Likelihood</th><th class='pb-1.5 pr-2 font-semibold normal-case text-[12px]' title='Short: likely, under 90s · Standard: needs explanation, 2–3 min · Extended: needs patience, human early'>Call Tier</th><th class='pb-1.5 pr-2 font-semibold normal-case text-[12px]' title='Pay likelihood × amount due — recovery value of trying first'>Expected Value</th><th class='pb-1.5 pr-2 font-semibold normal-case text-[12px]' title='Masked registered number'>Phone</th></tr></thead><tbody>{% for c in rows %}<tr class='border-t border-neutral-100 transition-colors hover:bg-[#faf8fd]' data-cid='{{ c.customer_id }}' title='Pay probability {{ c.p_pay }} — {{ c.reasons }}'><td class='py-2 pl-1 pr-1'><input type='checkbox' class='qpick h-3.5 w-3.5 accent-primary-foreground' data-cid='{{ c.customer_id }}' aria-label='Add {{ c.customer_id }} to dial queue' /></td><td class='py-2 pr-2 font-mono text-[12px] font-medium'>{{ c.customer_id }}</td><td class='py-2 pr-2 font-medium text-[13px]'>{{ c.name }}</td><td class='py-2 pr-2'><span class='inline-block h-1.5 w-16 overflow-hidden rounded-full bg-neutral-100' role='img'><span class='block h-1.5 rounded-full bg-primary-foreground' style='width:{{ c.score_pct }}%'></span></span></td><td class='py-2 pr-2'><span class='rounded-full px-2 py-0.5 text-[11px] font-semibold {{ c.tier_pill }}' title='{{ c.tier_tip }}'>{{ c.tier_label }}</span></td><td class='py-2 pr-2 font-mono tabular-nums text-[13px]'>₹{{ c.priority }}</td><td class='py-2 pr-2 font-mono text-xs text-neutral-500'>{{ c.phone_masked }}</td></tr>{% else %}<tr><td class='py-8 text-center text-sm text-neutral-400'><span class='mx-auto mb-1 block h-8 w-8 rounded-full bg-neutral-100'></span>Queue empty — everyone is capped, cooling down, or opted out</td></tr>{% endfor %}</tbody></table>
